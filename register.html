<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="background">

        <section class="register-box">

            <h1>Register</h1>


            <form action="home.html" method="get">

                <div class="input-box">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>

                <div class="input-box">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                        required
                    >

                </div>

                <div class="input-box">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>

                <div class="input-box">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        minlength="8"
                        required
                    >

                </div>

                <div class="input-box">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm password"
                        minlength="8"
                        required
                    >

                </div>

                <button type="submit">
                    Register
                </button>

            </form>

            <p class="account-text">

                Already have an account?

                <a href="index.html">
                    Login Here
                </a>

            </p>

        </section>

    </main>

</body>

</html>
