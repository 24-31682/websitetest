<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="background">

        <section class="login-box">

            <h1>Login</h1>

            <form id="loginForm">

                <div class="input-box">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="input-box">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <div class="remember">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="forgot.html">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

            <p class="account-text">

                Don't have an account?

                <a href="register.html">
                    Register Here
                </a>

            </p>

        </section>

    </main>

</body>

</html>
